NUM_SEEDS: 1
# this is adapted from Atari configuration 
NAME_INITIALS: "RE"
ALG_NAME: "pqn_hier_llm"
TOTAL_TIMESTEPS: 5e7 # 1e8 == 100M, but times 4 (frame-skipping) -> pqn paper: enough to outperform Rainbow
TOTAL_TIMESTEPS_DECAY: 5e7 # will be used for decay functions, in case you want to test for less timesteps and keep decays same
NUM_ENVS: 1024 #512 # parallel environments
# NUM_STEPS: 32 # steps per environment in each update
NUM_STEPS: 128 # steps per environment in each update
# NUM_ENVS / NUM_STEPS should be 8 for original PQN (they did 128/32)
EPS_START: 1.0
EPS_FINISH: 0.1 # Best for Kang
EPS_DECAY: 0.3 #Best for Kang
# EPS_FINISH: 0.001 #Best for seaquest
# EPS_DECAY: 0.1 # Best for Seaquest 
META_EPS_START: 0.1 # this will be the value until training is started
META_EPS_FINISH: 0.001
META_EPS_DECAY: 0.1 # ratio of total updates
NUM_EPOCHS: 5
NUM_MINIBATCHES: 128 # minibatches per epoch
NORM_TYPE: "layer_norm" # layer_norm or batch_norm
NORM_INPUT: False 
LR: 5.0e-4
# LR: 1.0e-3
MAX_GRAD_NORM: 10
# MAX_GRAD_NORM: 0.5 
LR_LINEAR_DECAY: False #True
GAMMA: 0.99
LAMBDA: 0.65
HIDDEN_SIZE: 64
NUM_LAYERS: 3
STICKY_ACTIONS: True
EPISODIC_LIFE: True

HIERARCHICAL: True # if False: use PQN rather than hierarchical PQN
META_POLICY: "llm" # llm, learned, conditional, combined
# META_GREEDY: True # True: take greedy option, else sample from q-dist
META_GREEDY: True # True: take greedy option, else sample from q-dist
META_SHAPED_REWARD: False # only makes sense for combined (meta-Q)
LLM_PRETRAIN: False #pretrain options with llm meta policy
RANDOM_PRETRAIN: False #pretrian options with random meta policy
PRETRAIN_LEN: 3700 #100000 #25000 # length of pretraining (128 envs)

# env specific
ENV_NAME: "Freeway"
ENV_KWARGS: {}

# evaluation
TEST_DURING_TRAINING: True 
TEST_INTERVAL: 0.1 # in terms of total updates
TEST_NUM_ENVS: 1024 #512
TEST_NUM_STEPS: 10000
TEST_MODIFS: True # whether to use modifications on test-env (no-enemies)
EPS_TEST: 0.0 # 0 for greedy policy
RECORD_VIDEO: True # in terms of total updates
