# Hierarchical PQN baseline for continuous-action mujoco playground.
NAME_INITIALS: "RE"
ALG_NAME: "pqn_mujoco_hier_baseline"

TOTAL_TIMESTEPS: 5e6
TOTAL_TIMESTEPS_DECAY: 5e6
NUM_ENVS: 1024
NUM_STEPS: 64
NUM_EPOCHS: 4
NUM_MINIBATCHES: 128

GAMMA: 0.99
LAMBDA: 0.95
META_LAMBDA: 0.95

LR_START: 3.0e-4
LR_END: 1.0e-5
LR_DECAY: 1.0
ANNEAL_LR: True
MAX_GRAD_NORM: 1.0

ACTIVATION: "relu"
NORM_TYPE: "layer_norm"
NORM_INPUT: False
ACTOR_HIDDEN_SIZES: [256, 256]
CRITIC_HIDDEN_SIZES: [256, 256]
META_HIDDEN_SIZES: [256, 256]
ACTOR_INIT_SCALE: 1.0
CRITIC_INIT_SCALE: 1.0
META_INIT_SCALE: 1.0
NUM_CRITICS: 2

NOISE_START: 0.2
NOISE_FINISH: 0.05
NOISE_DECAY: 0.8
LINSPACE_NOISE: False
THRESHOLD: 0.3
PENALTY_COEFF: 0.0

HIERARCHICAL: True
NUM_AGENTS: 3
META_POLICY: "learned"
META_EPS_START: 0.2
META_EPS_FINISH: 0.01
META_EPS_DECAY: 0.3

# If your env wrapper exposes info["all_rewards"], enable this and set OPTION_REWARD_KEY.
USE_OPTION_REWARDS: False
OPTION_REWARD_KEY: "all_rewards"

ENV_NAME: "hopper"
NORMALIZE_REWARD: True
NORMALIZE_OBS: True

TEST_DURING_TRAINING: True
TEST_INTERVAL: 0.1
TEST_NUM_ENVS: 512
EPS_TEST: 0.0
TEST_NOISE: 0.0
TEST_RETURN_KEY: "original_reward"

RECORD_VIDEO: False
VIDEO_NUM_STEPS: 256
VIDEO_HEIGHT: 256
VIDEO_WIDTH: 256
VIDEO_FPS: 20
VIDEO_CAMERA: null
MUJOCO_GL: "egl"

RETURN_METRICS: True
