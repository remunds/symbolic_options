# this is adapted from Atari configuration 
NAME_INITIALS: "RE"
ALG_NAME: "pqn_hier_combined_pretrain_reset1_meta_explore"
TOTAL_TIMESTEPS: 1e9
TOTAL_TIMESTEPS_DECAY: 1e9 # will be used for decay functions, in case you want to test for less timesteps and keep decays same
NUM_ENVS: 128 # parallel environments
NUM_STEPS: 32 # steps per environment in each update
EPS_START: 1.0
EPS_FINISH: 0.001
EPS_DECAY: 0.1 # ratio of total updates
META_EPS_START: 0.1 # this will be the value until training is started
META_EPS_FINISH: 0.001
META_EPS_DECAY: 0.1 # ratio of total updates
NUM_EPOCHS: 2 # minibatches per epoch
NUM_MINIBATCHES: 32 # minibatches per epoch
NORM_TYPE: "layer_norm" # layer_norm or batch_norm
# LR: 0.0001
LR: 1.0e-4
MAX_GRAD_NORM: 10
# MAX_GRAD_NORM: 0.5 
LR_LINEAR_DECAY: False #True
GAMMA: 0.99
LAMBDA: 0.65

HIERARCHICAL: True # False: use PQN rather than hierarchical PQN
META_POLICY: "combined" # llm, learned, conditional, combined
META_GREEDY: False # True: take greedy option, else sample from q-dist
META_SHAPED_REWARD: False # only makes sense for combined (meta-Q)
LLM_PRETRAIN: True #pretrain options with llm meta policy
RANDOM_PRETRAIN: False #pretrian options with random meta policy
PRETRAIN_LEN: 100000 # length of pretraining

# env specific
# ENV_NAME: "Seaquest"
ENV_NAME: "Kangaroo"
ENV_KWARGS: {}

# evaluation
TEST_DURING_TRAINING: True 
TEST_INTERVAL: 0.05 # in terms of total updates
TEST_NUM_ENVS: 128
TEST_NUM_STEPS: 10000
EPS_TEST: 0.0 # 0 for greedy policy
RECORD_VIDEO: True # in terms of total updates
