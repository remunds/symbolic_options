# this is adapted from Atari configuration 
NAME_INITIALS: "RE"
ALG_NAME: "pqn_kangaroo_test"
TOTAL_TIMESTEPS: 20e7
TOTAL_TIMESTEPS_DECAY: 20e7 # will be used for decay functions, in case you want to test for less timesteps and keep decays same
NUM_ENVS: 128 # parallel environments
NUM_STEPS: 32 # steps per environment in each update
EPS_START: 1.0
EPS_FINISH: 0.001
EPS_DECAY: 0.1 # ratio of total updates
NUM_EPOCHS: 2 # minibatches per epoch
NUM_MINIBATCHES: 32 # minibatches per epoch
NORM_TYPE: "layer_norm" # layer_norm or batch_norm
# LR: 0.0001
LR: 1.0e-4
MAX_GRAD_NORM: 10
# MAX_GRAD_NORM: 0.5 
LR_LINEAR_DECAY: False #True
GAMMA: 0.99
LAMBDA: 0.65
HIERARCHICAL: False 
META_POLICY: "combined" # llm, learned, conditional, combined
META_GREEDY: True
META_SHAPED_REWARD: False # only makes sense for combined (meta-Q)
LLM_PRETRAIN: 100000 # sets n_updates to pretrain. Only applicable for combined and conditional

# env specific
# ENV_NAME: "Seaquest"
ENV_NAME: "Kangaroo"
ENV_KWARGS: {}

# evaluation
TEST_DURING_TRAINING: True 
TEST_INTERVAL: 0.05 # in terms of total updates
TEST_NUM_ENVS: 128
TEST_NUM_STEPS: 10000
EPS_TEST: 0.0 # 0 for greedy policy
RECORD_VIDEO: True # in terms of total updates
