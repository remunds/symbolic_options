# this is adapted from Craftax PQN_RNN config
# NOTE: model is still defaul PQN, not RNN
NUM_SEEDS: 1 
NAME_INITIALS: "RE"
ALG_NAME: "pqn_rnn"
TOTAL_TIMESTEPS: 1e9
TOTAL_TIMESTEPS_DECAY: 1e9 # will be used for decay functions, in case you want to test for less timesteps and keep decays same
# NUM_ENVS: 1024 #parallel environments
NUM_ENVS: 512 #parallel environments
MEMORY_WINDOW: 0
NUM_STEPS: 128 # steps per environment in each update
EPS_START: 1.0
EPS_FINISH: 0.005
EPS_DECAY: 0.1

USE_RNN: True

META_EPS_START: 1.0 # this will be the value until training is started
META_EPS_FINISH: 0.005
META_EPS_DECAY: 0.1 # ratio of total updates

NUM_MINIBATCHES: 4 # minibatches per epoch
NUM_EPOCHS: 4 # minibatches per epoch
NORM_INPUT: True #!! This was deleted until Aug7
NORM_TYPE: "layer_norm" # layer_norm or batch_norm
HIDDEN_SIZE: 512
NUM_LAYERS: 1
NUM_RNN_LAYERS: 1
ADD_LAST_ACTION: True # adds last action to the input of the rnn
LR: 3.0e-4
MAX_GRAD_NORM: 0.5
LR_LINEAR_DECAY: True
REW_SCALE: 1.
GAMMA: 0.99
Q_LAMBDA: False
LAMBDA: 0.5 

HIERARCHICAL: True # False: use PQN rather than hierarchical PQN
META_POLICY: "llm" # llm, learned, conditional, combined
META_GREEDY: False
META_SHAPED_REWARD: False # only makes sense for combined (meta-Q)
LLM_PRETRAIN: False #pretrain options with llm meta policy
RANDOM_PRETRAIN: False #pretrian options with random meta policy
PRETRAIN_LEN: 7000 # length of pretraining

# env specific
# ENV_NAME: "Craftax-Symbolic-v1"
ENV_NAME: "Craftax-Classic-Symbolic-v1"
ENV_KWARGS: {}
USE_OPTIMISTIC_RESETS: True
OPTIMISTIC_RESET_RATIO: 16
LOG_ACHIEVEMENTS: False

# evaluation
WANDB_LOG_INTERVAL: 100
TEST_DURING_TRAINING: False #Unfortunately leads to long compilation times (9min)
TEST_INTERVAL: 0.1 # in terms of total updates
TEST_NUM_ENVS: 1024
TEST_NUM_STEPS: 10000
TEST_MODIFS: False
EPS_TEST: 0.0 # 0 for greedy policy
RECORD_VIDEO: False # in terms of total updates
