NAME_INITIALS: "RE"
ALG_NAME: "pqn_correct_scaling"
TOTAL_TIMESTEPS: 5e7
TOTAL_TIMESTEPS_DECAY: 5e7
NUM_ENVS: 1024
NUM_STEPS: 32
EPS_START: 1.0
EPS_FINISH: 0.01
EPS_DECAY: 0.1
NUM_EPOCHS: 1
NUM_MINIBATCHES: 256
NORM_TYPE: "layer_norm"
NORM_INPUT: False
LR: 1e-4
MAX_GRAD_NORM: 10
LR_LINEAR_DECAY: True
GAMMA: 0.99
LAMBDA: 0.65
HIDDEN_SIZE: 64
NUM_LAYERS: 3
STICKY_ACTIONS: False
EPISODIC_LIFE: False

HIERARCHICAL: False

# env specific
ENV_NAME: "Seaquest"
ENV_KWARGS: {}

# pixel processing
PIXEL_RESIZE: True
PIXEL_GRAYSCALE: True
USE_NATIVE_DOWNSCALING: True
PIXEL_RESIZE_SHAPE: [84, 84]

# evaluation
TEST_DURING_TRAINING: True
TEST_INTERVAL: 0.1
TEST_NUM_ENVS: 128
TEST_NUM_STEPS: 10000
EPS_TEST: 0.0
RECORD_VIDEO: True
eval_envs:
  - label: "clean"
    noisy_eval: false
    no_enemies: false
  - label: "mod"
    noisy_eval: false
    no_enemies: true
