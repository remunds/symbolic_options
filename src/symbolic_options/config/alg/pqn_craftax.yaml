# this is adapted from Atari configuration 
NAME_INITIALS: "RE"
ALG_NAME: "pqn_hier"
TOTAL_TIMESTEPS: 1e9
TOTAL_TIMESTEPS_DECAY: 1e9 # will be used for decay functions, in case you want to test for less timesteps and keep decays same
NUM_ENVS: 1024 #parallel environments
NUM_STEPS: 1 # steps per environment in each update
EPS_START: 0.1
EPS_FINISH: 0.005
EPS_DECAY: 0.2 # ratio of total updates
NUM_EPOCHS: 1 # minibatches per epoch
NUM_MINIBATCHES: 1 # minibatches per epoch
NORM_TYPE: "layer_norm" # layer_norm or batch_norm
HIDDEN_SIZE: 1024
NUM_LAYERS: 4
LR: 1.0e-4
MAX_GRAD_NORM: 1.0
LR_LINEAR_DECAY: True
GAMMA: 0.99
Q_LAMBDA: False
LAMBDA: 0 

HIERARCHICAL: True # False: use PQN rather than hierarchical PQN
META_POLICY: "llm" # llm, learned, conditional, combined
META_GREEDY: True
META_SHAPED_REWARD: False # only makes sense for combined (meta-Q)
LLM_PRETRAIN: False #pretrain options with llm meta policy
RANDOM_PRETRAIN: False #pretrian options with random meta policy
PRETRAIN_LEN: 100000 # length of pretraining

# env specific
ENV_NAME: "Craftax-Symbolic-v1"
ENV_KWARGS: {}
USE_OPTIMISTIC_RESETS: True
OPTIMISTIC_RESET_RATIO: 16
LOG_ACHIEVEMENTS: True

# evaluation
WANDB_LOG_INTERVAL: 100
TEST_DURING_TRAINING: False 
TEST_INTERVAL: 1.0 # 0.01 # in terms of total updates
TEST_NUM_ENVS: 1024 # 512
TEST_NUM_STEPS: 10000
EPS_TEST: 0.0 # 0 for greedy policy
RECORD_VIDEO: True # in terms of total updates
