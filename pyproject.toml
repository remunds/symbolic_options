[project]
name = "symbolic-options"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "craftax>=1.4.5",
    "flashbax>=0.1.3",
    "flax>=0.10.4",
    "gymnax>=0.0.8",
    "hydra-core>=1.3.2",
    "jax[cuda12]>=0.6.0",
    "jaxatari",
    "omegaconf>=2.3.0",
    "optax>=0.2.4",
    "rtpt>=0.0.4",
    "safetensors>=0.5.3",
    "wandb[media]>=0.19.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
jaxatari = { git = "https://github.com/k4ntz/JAXAtari", rev = "62cd59ba60abb2b9bcd0cc6852a7aa16d3a87378" }
